name: Publicar Tryssen
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: 'Publicar el estado actual para revisar el diseño, aunque falten portada y contacto'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Preparar la web
        env:
          REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.revision }}
        run: |
          if [ "$REVISION" = "true" ]; then
            python scripts/build.py --optimize
          else
            python scripts/build.py --optimize --strict
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
